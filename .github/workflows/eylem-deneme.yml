# GEÇİCİ (28 Ekim 2026, bakım: Node.js 24 eylem sürümleri). Yalnız bakim-node24 dalına itmede çalışır; main'e
# alınmadan önce silinir. Paylaşım yapmaz, siteyi yayınlamaz.
name: Eylem sürümü denemesi (geçici)

on:
  push:
    branches: [bakim-node24]

permissions:
  contents: read

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q requests && python -c "import requests, sys; print(sys.version)"
      - name: Önbellek yaz
        run: mkdir -p veri-deneme && date -u > veri-deneme/zaman.txt
      - uses: actions/cache/save@v5
        with:
          path: veri-deneme
          key: eylem-deneme-${{ github.run_id }}
      - run: rm -rf veri-deneme
      - uses: actions/cache/restore@v5
        with:
          path: veri-deneme
          key: eylem-deneme-${{ github.run_id }}
      - run: test -s veri-deneme/zaman.txt && cat veri-deneme/zaman.txt
      - name: Örnek site
        run: mkdir -p site && echo "<!doctype html><title>deneme</title>" > site/index.html && echo ok > site/robots.txt
      - uses: actions/upload-artifact@v6
        with:
          name: onizleme-deneme
          path: site
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  oku:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: onizleme-deneme
          path: site
      - run: ls -la site && grep -q deneme site/index.html && test -s site/robots.txt && echo "indirme tamam"
