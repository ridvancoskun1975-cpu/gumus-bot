name: Kur kaynağı denemesi (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          for u in \
            "https://api.frankfurter.dev/v2/providers/ecb/rate/usd/try" \
            "https://api.frankfurter.dev/v2/providers/ecb/rates?base=USD&quotes=TRY&from=2026-10-01" \
            "https://api.frankfurter.dev/v2/providers/ecb/rates?base=USD&symbols=TRY&from=2026-10-01&to=2026-10-13" \
            "https://api.frankfurter.dev/v2/rates?providers=ecb&base=USD&quotes=TRY&from=2026-10-01" \
            "https://api.frankfurter.dev/v1/2026-10-01..?base=USD&symbols=TRY" ; do
            echo "=== $u"; curl -s -m 20 "$u" | head -c 900; echo
          done
