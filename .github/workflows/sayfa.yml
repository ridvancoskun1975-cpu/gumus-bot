name: Bilgi sayfasını yayınla

# Instagram'a paylaşım yapmadan yalnızca bilgi sayfasını (GitHub Pages ana sayfası) son kayıtlarla
# yeniden üretip yayınlar. Normalde sayfa her paylaşımda kendiliğinden güncellenir; bu iş, sayfada
# yapılan bir değişikliği paylaşımı beklemeden yayına almak için. Elle: Actions → Bilgi sayfasını
# yayınla → Run workflow (dal: main).
# Not: Pages sitesini baştan kurar; o anki paylaşımın video/görsel dosyaları siteden kalkar
# (Instagram onları paylaşım sırasında zaten almış olur). Paylaşım saatlerine (~10:00, ~14:00,
# ~20:00) denk getirme: paylaşım işi dosyalarını yayınlarken bu iş araya girerse paylaşım bozulabilir.
# Hafta içi 12:35 ve 16:35 gün içi kaydından sonra kaydet.yml başlatır (Rıdvan, 20 Ekim 2026).
# Pazar yorumu paylaşılınca paylas.yml bu işi kendisi başlatır ("Son pazar analizi" düğmesi aynı gün güncellensin).
# Rıdvan, 18 Ekim 2026: sayfa üretilemezse 2 kez yeniden denenir (bot/sayfa_uret.sh); yine olmazsa HİÇ yayınlanmaz,
# canlı site önceki hâliyle kalır ve günlüğe "BİLGİ SAYFASI YEDEK YOL" yazılır (gece kontrolü bildirir).
on:
  workflow_dispatch:
  # PDF Gümüş Rehberi baskı günü (bot/rehber_pdf.py → BASKI_AYLARI; Rıdvan, 19 Ekim 2026: yılda bir): 1 Ocak 00:07 TR.
  # Sitedeki PDF kartı o gün "Yakında"dan indirmeye (ya da yeni yılın baskısına) döner; yılbaşı tatilinde paylaşım
  # olmasa da site o gün güncellensin. Paylaşım saatlerine denk gelmez.
  schedule:
    - cron: '7 21 31 12 *'

permissions:
  contents: read

concurrency:
  group: gumus-sayfa
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sonuc: ${{ steps.sayfa.outputs.sonuc }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Gerekenleri kur
        timeout-minutes: 6
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium

      # Fiyat kayıtları paylaşım işinin sakladığı önbellekten okunur (geri yazılmaz).
      - name: Günlük kayıtları getir
        uses: actions/cache/restore@v5
        with:
          path: veri/gecmis.json
          key: gecmis-sayfa-${{ github.run_id }}
          restore-keys: gecmis-

      # Gün içi kayıtlar (kaydet.yml): 12:35 ve 16:35 yenilemesinde bugünün fiyatı en yeni gün içi noktadan gelir
      # (bot/sayfa.py → gun_ici_ile). Yalnızca okunur; bulunamazsa sayfa günlük kayıtlarla üretilir.
      - name: Gün içi kayıtları getir
        uses: actions/cache/restore@v5
        with:
          path: veri/gun_ici.json
          key: gunici-sayfa-${{ github.run_id }}
          restore-keys: gunici-

      # Önbellek boş ya da eksikse özel gumus-kayit'teki yedekten tamamlanır (bot/yedek.py); yalnızca okur.
      - name: Günlük kayıtları yedekle tamamla
        continue-on-error: true
        timeout-minutes: 1
        env:
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
        run: python bot/yedek.py birlestir

      - name: Bilgi sayfasını üret
        id: sayfa
        continue-on-error: true
        timeout-minutes: 6
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}   # yalnızca son pazar analizinin bağlantısını bulmak için okur
        run: bash bot/sayfa_uret.sh site   # içerik denetimi betikte (index, rehber, site haritası)

      - name: Yayınlanmadı (önceki hâl kaldı)
        if: steps.sayfa.outputs.sonuc != 'yeni'
        run: |
          echo "::warning::BİLGİ SAYFASI YEDEK YOL: sayfa üretilemedi; yayınlanmadı, canlı site önceki hâliyle kaldı."

      - name: Son başarılı hâli sakla
        if: steps.sayfa.outputs.sonuc == 'yeni'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: veri/sayfa_son
          key: sayfa-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v5
        if: steps.sayfa.outputs.sonuc == 'yeni'
        with:
          path: site

  yayinla:
    needs: uret
    if: needs.uret.outputs.sonuc == 'yeni'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - name: Sayfayı internete koy (GitHub Pages)
        id: yayin
        uses: actions/deploy-pages@v5
