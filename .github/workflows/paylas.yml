name: Gümüş paylaşımı

on:
  schedule:
    # Saatler UTC'dir. Türkiye = UTC+3. GitHub zamanlı işleri genelde 5-15 dk gecikmeli başlatır.
    - cron: '50 6 * * 1-5'    # 09:50 TR -> Reels
    - cron: '50 16 * * 1-5'   # 19:50 TR -> Günlük özet
    - cron: '50 6 * * 6'      # Cumartesi 09:50 TR -> Haftalık özet
    # Hafta içi 13:50 TR -> Gümüş rehberi (bilgi). Hangi gün hangi bölüm: bot/bilgi.py → takvim()
    # (ilk hafta her gün, sonra salı ve perşembe). Takvimde olmayan günlerde "kontrol" işi birkaç saniyede biter.
    - cron: '50 10 * * 1-5'
  workflow_dispatch:
    inputs:
      tur:
        description: "Ne üretilsin?"
        type: choice
        options: [reels, post, hafta, yasal, bilgi]
        default: reels
      konu:
        description: "Yalnızca bilgi türü: bölüm no (1-6). Boşsa bugünün takvim bölümü."
        type: string
        default: ""
      deneme:
        description: "Deneme: sadece üret, Instagram'a paylaşma"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gumus-paylasim
  cancel-in-progress: false

jobs:
  # Türü belirler; bilgi gününde değilse kurulum yapmadan bitirir (zamanlı bilgi çalışması her iş günü başlar).
  kontrol:
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    timeout-minutes: 3
    outputs:
      tur: ${{ steps.tur.outputs.tur }}
      calis: ${{ steps.tur.outputs.calis }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bot

      - name: Türü belirle
        id: tur
        env:
          KONU: ${{ inputs.konu }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tur="${{ inputs.tur }}"
          elif [ "${{ github.event.schedule }}" = "50 16 * * 1-5" ]; then
            tur=post
          elif [ "${{ github.event.schedule }}" = "50 6 * * 6" ]; then
            tur=hafta
          elif [ "${{ github.event.schedule }}" = "50 10 * * 1-5" ]; then
            tur=bilgi
          else
            tur=reels
          fi
          calis=true
          if [ "$tur" = "bilgi" ] && [ -z "$KONU" ]; then
            bolum=$(python3 bot/bilgi.py bugun)   # hata verirse adım başarısız olur (bash -e)
            if [ -z "$bolum" ]; then
              calis=false
              echo "Bugün takvimde bilgi gönderisi yok; çalışma atlandı."
            else
              echo "Bugünün rehber bölümü: $bolum"
            fi
          fi
          echo "tur=$tur" >> "$GITHUB_OUTPUT"
          echo "calis=$calis" >> "$GITHUB_OUTPUT"

  uret:
    needs: kontrol
    if: needs.kontrol.outputs.calis == 'true'
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    timeout-minutes: 15
    outputs:
      devam: ${{ steps.uret.outputs.devam }}
      tur: ${{ needs.kontrol.outputs.tur }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Gerekenleri kur
        timeout-minutes: 6
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium

      # Müzik depoda şifreli durur (Pixabay lisansı müziğin tek başına dağıtılmasına izin vermiyor).
      - name: Müziği aç
        env:
          MUZIK_ANAHTAR: ${{ secrets.MUZIK_ANAHTAR }}
        run: |
          if [ -z "$MUZIK_ANAHTAR" ]; then
            echo "::warning::MUZIK_ANAHTAR tanımlı değil; video müziksiz üretilecek."
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in assets/muzik.mp3.enc -out assets/muzik.mp3 -pass env:MUZIK_ANAHTAR
          fi

      # Günlük fiyat kayıtları ("önceki gün" ve haftalık özet için) GitHub önbelleğinde durur.
      - name: Günlük kayıtları getir
        uses: actions/cache/restore@v4
        with:
          path: veri/gecmis.json
          key: gecmis-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gecmis-

      - name: Görseli / videoyu üret
        id: uret
        timeout-minutes: 5
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          HESAP_ADI: ${{ vars.HESAP_ADI }}
          METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
          KONU: ${{ inputs.konu }}
        run: |
          ek=()
          if [ "${{ needs.kontrol.outputs.tur }}" = "bilgi" ] && [ -n "$KONU" ]; then ek=(--konu "$KONU"); fi
          python bot/main.py hazirla --tur "${{ needs.kontrol.outputs.tur }}" --cikti site "${ek[@]}"
          if [ -f site/meta.json ]; then
            echo "devam=true" >> "$GITHUB_OUTPUT"
          else
            echo "devam=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Günlük kayıtları sakla
        if: always() && hashFiles('veri/gecmis.json') != ''
        uses: actions/cache/save@v4
        with:
          path: veri/gecmis.json
          key: gecmis-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Önizleme olarak sakla
        if: steps.uret.outputs.devam == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onizleme-${{ needs.kontrol.outputs.tur }}
          path: site
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: steps.uret.outputs.devam == 'true'
        with:
          path: site

  yayinla:
    needs: uret
    if: needs.uret.outputs.devam == 'true' && (github.event_name == 'schedule' || inputs.deneme == false)
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - name: Dosyayı internete koy (GitHub Pages)
        id: yayin
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q requests

      - uses: actions/download-artifact@v4
        with:
          name: onizleme-${{ needs.uret.outputs.tur }}
          path: site

      - name: Instagram'a paylaş
        timeout-minutes: 8
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python bot/main.py yayinla --cikti site --url "${{ steps.yayin.outputs.page_url }}"
