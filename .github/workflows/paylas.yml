name: Gümüş paylaşımı

on:
  schedule:
    # Saatler UTC'dir. Türkiye = UTC+3. GitHub zamanlı işleri genelde 5-15 dk gecikmeli başlatır.
    - cron: '50 6 * * 1-5'    # 09:50 TR -> Reels
    - cron: '50 16 * * 1-5'   # 19:50 TR -> Günlük özet
    - cron: '50 6 * * 6'      # Cumartesi 09:50 TR -> Haftalık özet
    - cron: '50 7 * * 0'      # Pazar 10:50 TR -> Yapay zekâ yorumu (kısa/orta vade, kaydırmalı 3 görsel)
    # Hafta içi 13:50 TR -> Gümüş rehberi (bilgi). Hangi gün hangi bölüm: bot/bilgi.py → takvim()
    # (19–21 Ekim 2026 her gün, 28 Ekim'den itibaren haftada 1, çarşamba; Rıdvan 19 Ekim 2026). Rehber olmayan günlerden ayın ilk iş günü aylık özet
    # gider (bot/aylik.py; ilki 2 Kasım 2026). İkisi de yoksa "kontrol" işi birkaç saniyede biter.
    # Rehber günü akışa sesli Reels gider (kaydırmalının yerine; main.REHBER_REELS), hikâyeye müzikli rehber videosu.
    # Rehber ve aylık özet yoksa rehber arşivi günü olabilir (bot/bilgi.py → arsiv_takvim(); #3–#5 birer kez,
    # haftalık rehber sırasında, çarşamba): tür kisa, yalnız sesli Reels. Cumartesi kısa Reels'i 16 Ekim 2026'da kaldırıldı (Rıdvan).
    - cron: '50 10 * * 1-5'
    # Çarşamba ve cuma 11:50 TR haftalık kartlar (bot/kart.py) 19 Ekim 2026'da kaldırıldı (Rıdvan: takipçiyi
    # bıktırmamak için paylaşım sayısı azaltıldı; kartlar sabah ve akşam verilen fiyatın tekrarıydı). Kod duruyor:
    # elle Run workflow → tür: kart; geri açmak için cron '50 8 * * 3,5' ve aşağıdaki eşleme yeter.
  workflow_dispatch:
    inputs:
      tur:
        description: "Ne üretilsin?"
        type: choice
        options: [reels, post, hafta, ay, yasal, bilgi, kisa, yorum, hikaye, kart, tanitim]
        default: reels
      konu:
        description: "bilgi, kisa, hikaye: rehber bölüm no (boşsa bilgi için bugünün rehberi, kisa için bugünün arşiv Reels'i; hikaye için zorunlu). kart: gram ya da parite (boşsa günün kartı). yorum + ornek: örneğin pazarı (YYYY-AA-GG)."
        type: string
        default: ""
      deneme:
        description: "Deneme: sadece üret, Instagram'a paylaşma"
        type: boolean
        default: true
      onay:
        description: "Günlük sınırı aşmaya Rıdvan sohbette onay verdi (yalnızca o açıkça onaylarsa işaretle)"
        type: boolean
        default: false
      goril:
        description: "Goril önizlemesi (yalnız deneme açıkken, reels, post ve hafta türünde): bu hâl çizilir"
        type: choice
        options: [yok, sevinen, uzulen, gezinen, istif]
        default: yok
      ses:
        description: "Seslendirme önizlemesi (yalnız deneme açıkken; bilgi, kisa ve yorum türünde): ses adı, ör. Kore, Charon. Boş = seçili ses"
        type: string
        default: ""
      ornek:
        description: "Örnek veriyle önizleme (yalnız deneme açıkken, yorum türünde): Claude API'ye ve MetalCharts'a istek atmaz, ücretsiz"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gumus-paylasim
  cancel-in-progress: false

jobs:
  # Türü belirler; bilgi gününde değilse kurulum yapmadan bitirir (zamanlı bilgi çalışması her iş günü başlar).
  # Günlük sınır: bugün 4 paylaşım yapılmışsa, onay yoksa paylaşmadan durur (bot/sinir.py).
  kontrol:
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read   # günlük sınır için bugünkü çalıştırmaları okur
    outputs:
      tur: ${{ steps.tur.outputs.tur }}
      calis: ${{ steps.tur.outputs.calis }}
      hikaye: ${{ steps.sinir.outputs.hikaye }}   # tam ya da yok (günlük sınır; bot/sinir.py)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bot

      - name: Türü belirle
        id: tur
        env:
          KONU: ${{ inputs.konu }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tur="${{ inputs.tur }}"
          elif [ "${{ github.event.schedule }}" = "50 16 * * 1-5" ]; then
            tur=post
          elif [ "${{ github.event.schedule }}" = "50 6 * * 6" ]; then
            tur=hafta
          elif [ "${{ github.event.schedule }}" = "50 7 * * 0" ]; then
            tur=yorum
          elif [ "${{ github.event.schedule }}" = "50 10 * * 1-5" ]; then
            tur=bilgi
          else
            tur=reels
          fi
          calis=true
          if [ "$tur" = "bilgi" ] && [ -z "$KONU" ]; then
            bolum=$(python3 bot/bilgi.py bugun)   # hata verirse adım başarısız olur (bash -e)
            if [ -z "$bolum" ]; then
              ay=""
              if [ "${{ github.event_name }}" = "schedule" ]; then ay=$(python3 bot/aylik.py bugun); fi
              arsiv=""
              if [ "${{ github.event_name }}" = "schedule" ]; then arsiv=$(python3 bot/bilgi.py arsiv); fi
              if [ "$ay" = "ay" ]; then
                tur=ay
                echo "Bugün rehber yok, aylık özet günü."
              elif [ -n "$arsiv" ]; then
                tur=kisa
                echo "Bugün rehber yok, rehber arşivi Reels'i günü: bölüm $arsiv (yalnız sesli Reels)."
              else
                calis=false
                echo "Bugün takvimde bilgi gönderisi, aylık özet ya da arşiv Reels'i yok; çalışma atlandı."
              fi
            else
              echo "Bugünün rehber bölümü: $bolum"
            fi
          fi
          # hikaye: yalnızca rehber bölümünün hikâye kareleri (gönderisi önceden paylaşılmış bölüm için)
          if [ "$tur" = "hikaye" ] && [ -z "$KONU" ]; then
            echo "::error::hikaye türünde konu (rehber bölüm no) verilmeli."
            exit 1
          fi
          if [ "$tur" = "kisa" ] && [ -z "$KONU" ]; then
            bolum=$(python3 bot/bilgi.py arsiv)
            if [ -z "$bolum" ]; then
              calis=false
              echo "Bugün rehber arşivi Reels'i günü değil; çalışma atlandı (elle: konu ver)."
            else
              echo "Bugünün rehber arşivi Reels'i: bölüm $bolum"
            fi
          fi
          if [ "$tur" = "kart" ] && [ -z "$KONU" ]; then
            kart=$(python3 bot/kart.py bugun)
            if [ -z "$kart" ]; then
              calis=false
              echo "Bugün haftalık kart yok; çalışma atlandı."
            else
              echo "Bugünün kartı: $kart"
            fi
          fi
          # Pazar yorumu bekletme (Rıdvan, 17 Ekim 2026 14:09: "pazar yorumu bizim işimiz bitene kadar beklesin"):
          # bot/PAZAR_BEKLET varken zamanlı pazar çalışması paylaşmadan biter. Elle (Run workflow → tür: yorum) çalışır.
          # İş bitince dosya silinir.
          if [ "$tur" = "yorum" ] && [ "${{ github.event_name }}" = "schedule" ] && [ -f bot/PAZAR_BEKLET ]; then
            calis=false
            echo "::warning::Pazar yorumu bekletiliyor (bot/PAZAR_BEKLET). Paylaşılmadı; iş bitince elle gönderilecek."
          fi
          echo "tur=$tur" >> "$GITHUB_OUTPUT"
          echo "calis=$calis" >> "$GITHUB_OUTPUT"

      # Günde en fazla 4 (Rıdvan, 14 Ekim 2026; önce 3). 19 Ekim 2026'dan beri takipçinin gördüğü her şey sayılır:
      # akış gönderisi, Reels ve hikâye ayrı ayrı. Çalıştırma günü 4'ün üstüne çıkaracaksa önce hikâye kopyası düşer
      # (çıktı hikaye=yok → yayinla hikâyesiz paylaşır); hikâyesiz de sığmıyorsa ve onay yoksa iş hata verip durur:
      # hiçbir şey üretilmez, paylaşılmaz; GitHub "Run failed" e-postası gönderir. Onay Claude sohbetinden verilir:
      # Rıdvan "onayla" derse Claude aynı türü onay işaretiyle yeniden başlatır.
      # Deneme çalıştırmasında yalnızca sayıyı yazar. Sayım GitHub geçmişinden; Instagram'a istek atılmaz.
      - name: Günlük sınır (en fazla 4 içerik, hikâyeler dahil)
        id: sinir
        if: steps.tur.outputs.calis == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TUR: ${{ steps.tur.outputs.tur }}
          KONU: ${{ inputs.konu }}
          YAYIN: ${{ github.event_name == 'schedule' || inputs.deneme == false }}
          ONAY: ${{ github.event_name == 'workflow_dispatch' && inputs.onay == true }}
        run: python3 bot/sinir.py --yayin "$YAYIN" --onay "$ONAY" --tur "$TUR" --konu "$KONU"

  uret:
    needs: kontrol
    if: needs.kontrol.outputs.calis == 'true'
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    # Pazar yorumu Opus 5.5 "ekstra yüksek" çabayla yazılır; düşünme dakikalar sürebilir, süre geniş.
    timeout-minutes: ${{ needs.kontrol.outputs.tur == 'yorum' && 45 || (needs.kontrol.outputs.tur == 'bilgi' || needs.kontrol.outputs.tur == 'kisa') && 25 || 15 }}
    outputs:
      devam: ${{ steps.uret.outputs.devam }}
      tur: ${{ needs.kontrol.outputs.tur }}
      hikaye: ${{ needs.kontrol.outputs.hikaye }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Gerekenleri kur
        timeout-minutes: 6
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium

      # Müzik depoda şifreli durur (Pixabay lisansı müziğin tek başına dağıtılmasına izin vermiyor).
      - name: Müziği aç
        env:
          MUZIK_ANAHTAR: ${{ secrets.MUZIK_ANAHTAR }}
        run: |
          if [ -z "$MUZIK_ANAHTAR" ]; then
            echo "::warning::MUZIK_ANAHTAR tanımlı değil; video müziksiz üretilecek."
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in assets/muzik.mp3.enc -out assets/muzik.mp3 -pass env:MUZIK_ANAHTAR
          fi

      # Günlük fiyat kayıtları ("önceki gün" ve haftalık özet için) GitHub önbelleğinde durur.
      - name: Günlük kayıtları getir
        uses: actions/cache/restore@v4
        with:
          path: veri/gecmis.json
          key: gecmis-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gecmis-

      # Önbellek silinmiş ya da eksikse günler özel gumus-kayit deposundaki yedekten (yedek/gecmis.json)
      # tamamlanır (bot/yedek.py; Rıdvan, 18 Ekim 2026 "8 önerin uygun"). Hata verirse yalnızca uyarı çıkar.
      - name: Günlük kayıtları yedekle tamamla
        continue-on-error: true
        timeout-minutes: 1
        env:
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
        run: python bot/yedek.py birlestir

      # Gün içi noktalar (akşam özetindeki "Gün içi: en düşük … · en yüksek …" satırı) ayrı dosyada ve ayrı
      # önbellekte: yalnızca fiyat alan çalıştırmalar (Reels, özet, kart) ve kaydet.yml yazar.
      - name: Gün içi kayıtları getir
        uses: actions/cache/restore@v4
        with:
          path: veri/gun_ici.json
          key: gunici-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gunici-

      # Rehber Reels'inin (rehber günü bilgi, arşiv günü kisa) kadın sesi ve pazar Reels'inin (yorum) erkek sesi seslendirmesi (bot/ses.py): anahtar GEMINI_API_KEY sırrında
      # (Rıdvan, 16 Ekim 2026), yoksa özel gumus-kayit deposunda; günlükte gizlenir. Alınamazsa Reels
      # bugünkü gibi yalnızca müzikle üretilir.
      - name: Seslendirme anahtarı
        if: needs.kontrol.outputs.tur == 'kisa' || needs.kontrol.outputs.tur == 'bilgi' || needs.kontrol.outputs.tur == 'yorum'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GEMINI_SIRRI: ${{ secrets.GEMINI_API_KEY }}
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
        run: |
          a=$(printf '%s' "$GEMINI_SIRRI" | tr -d '[:space:]')
          if [ -z "$a" ]; then
            a=$(curl -fsS -H "Authorization: Bearer $KAYIT_PAT" -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/ridvancoskun1975-cpu/gumus-kayit/contents/anahtarlar/gemini.txt" \
                  2>/dev/null | tr -d '[:space:]') || a=""
          fi
          if [ -n "$a" ]; then
            echo "::add-mask::$a"
            echo "GEMINI_API_KEY=$a" >> "$GITHUB_ENV"
          else
            echo "::warning::Seslendirme anahtarı alınamadı; rehber Reels'i yalnızca müzikle üretilecek."
          fi

      - name: Görseli / videoyu üret
        id: uret
        # rehber ve arşiv Reels'i: bölümün tamamı kare kare seslendirilir (Gemini dakikalık sınırında bekleme olabilir)
        timeout-minutes: ${{ needs.kontrol.outputs.tur == 'yorum' && 35 || (needs.kontrol.outputs.tur == 'bilgi' || needs.kontrol.outputs.tur == 'kisa') && 15 || 5 }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # yalnızca pazar yorumu kullanır
          YZ_MODEL: ${{ vars.YZ_MODEL }}                         # boşsa claude-opus-5-5
          YZ_CABA: ${{ vars.YZ_CABA }}                           # boşsa xhigh (ekstra yüksek)
          API_HARCAMA_DOSYA: ${{ runner.temp }}/api-harcama.jsonl  # pazar yorumunun token/arama sayıları
          KONU: ${{ inputs.konu }}
          DENEME: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme }}   # denemede gün içi nokta yazılmaz
          # Goril hâlini zorlar (bot/goril.py); yalnız paylaşmayan elle denemede, başlangıç tarihinden önce de.
          GORIL_DENEME: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme && inputs.goril != 'yok' && inputs.goril || '' }}
          # Seslendirmede başka ses dener (bot/ses.py); yalnız paylaşmayan elle denemede.
          SES_ADI: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme && inputs.ses || '' }}
          # Pazar yorumunu örnek veriyle önizler (Claude API ve MetalCharts isteği yok); yalnız paylaşmayan elle denemede.
          ORNEK: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme && inputs.ornek && 'true' || '' }}
        run: |
          ek=()
          case "${{ needs.kontrol.outputs.tur }}" in
            bilgi|kisa|hikaye|kart) if [ -n "$KONU" ]; then ek=(--konu "$KONU"); fi ;;
            yorum) if [ "$ORNEK" = "true" ]; then
                     ek=(--ornek); echo "Örnek veriyle önizleme (Claude API isteği yok)."
                     # konu = YYYY-AA-GG: örneği o pazar için üret (ör. 2026-10-25)
                     if [ -n "$KONU" ]; then export ORNEK_GUN="$KONU"; echo "Örnek günü: $KONU"; fi
                   fi ;;
          esac
          python bot/main.py hazirla --tur "${{ needs.kontrol.outputs.tur }}" --cikti site "${ek[@]}"
          if [ -f site/meta.json ]; then
            echo "devam=true" >> "$GITHUB_OUTPUT"
          else
            echo "devam=false" >> "$GITHUB_OUTPUT"
          fi

      # Bilgi sayfası (Instagram biyografisindeki bağlantı): site/index.html'i son kayıtlarla yeniden
      # üretir (fiyat, hesap makinesi, son günler, rehber, kaynaklar, son pazar analizi düğmesi) ve bağlantı
      # önizlemesi og.png'yi çizer. Paylaşım hiçbir durumda etkilenmez.
      # Rıdvan, 18 Ekim 2026: hata verirse 30 sn ve 90 sn arayla 2 kez yeniden dener (bot/sayfa_uret.sh); yine
      # olmazsa sitenin son başarılı hâli (önbellek "sayfa-") yayınlanır, günlüğe "BİLGİ SAYFASI YEDEK YOL"
      # yazılır ve gece kontrolü Rıdvan'a bildirir. Böylece site hiçbir zaman dosya listesine dönmez.
      - name: Bilgi sayfası
        id: sayfa
        if: steps.uret.outputs.devam == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}   # yalnızca son pazar analizinin bağlantısını bulmak için okur
        run: bash bot/sayfa_uret.sh site

      - name: Bilgi sayfası · son başarılı hâli getir
        id: sayfa_onceki
        if: steps.uret.outputs.devam == 'true' && steps.sayfa.outputs.sonuc != 'yeni'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: veri/sayfa_son
          key: sayfa-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sayfa-

      - name: Bilgi sayfası · önceki hâli yayınla
        if: steps.uret.outputs.devam == 'true' && steps.sayfa.outputs.sonuc != 'yeni'
        continue-on-error: true
        env:
          ANAHTAR: ${{ steps.sayfa_onceki.outputs.cache-matched-key }}
        run: |
          if [ -s veri/sayfa_son/index.html ]; then
            cp -r veri/sayfa_son/. site/
            echo "::warning::BİLGİ SAYFASI YEDEK YOL: yeni sayfa üretilemedi, sitenin önceki hâli yayınlandı ($ANAHTAR)."
          else
            echo "::warning::BİLGİ SAYFASI YEDEK YOL: yeni sayfa üretilemedi, önceki hâl de bulunamadı; site bu paylaşımda yalnızca paylaşım dosyalarıyla yayınlanır."
          fi

      - name: Bilgi sayfası · son başarılı hâli sakla
        if: steps.sayfa.outputs.sonuc == 'yeni'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: veri/sayfa_son
          key: sayfa-${{ github.run_id }}-${{ github.run_attempt }}

      # Takipçi sayısı yalnızca sana özel gumus-kayit deposuna (takipci.md) yazılır.
      # Bu depo ve günlükleri herkese açık olduğu için sayı günlüğe hiç yazdırılmaz.
      # Kayıt başarısız olursa yalnızca uyarı çıkar; paylaşım etkilenmez.
      - name: Takipçi kaydı
        if: always() && needs.kontrol.outputs.tur != 'yasal'
        continue-on-error: true
        timeout-minutes: 2
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
          DENEME: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme }}
        run: python bot/kayit.py --tur "${{ needs.kontrol.outputs.tur }}"

      # Pazar yorumunun Claude API harcaması (token ve arama; deneme dahil) özel gumus-kayit deposuna
      # yazılır (api-bakiye.md). Tutar günlüğe yazılmaz. Kredi takibi: bot/bakiye.py ve bakiye.yml.
      - name: API harcama kaydı
        if: always() && needs.kontrol.outputs.tur == 'yorum'
        continue-on-error: true
        timeout-minutes: 2
        env:
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
          DENEME: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme }}
          API_HARCAMA_DOSYA: ${{ runner.temp }}/api-harcama.jsonl
        run: python bot/bakiye.py kaydet --tur yorum

      - name: Günlük kayıtları sakla
        if: always() && hashFiles('veri/gecmis.json') != ''
        uses: actions/cache/save@v4
        with:
          path: veri/gecmis.json
          key: gecmis-${{ github.run_id }}-${{ github.run_attempt }}

      # Günlük kayıtların yedeği (Rıdvan, 18 Ekim 2026): deneme olmayan her çalıştırmada özel gumus-kayit deposuna
      # (yedek/gecmis.json). Yedek hiçbir zaman küçülmez, değişiklik yoksa yazılmaz, günlüğe fiyat yazılmaz.
      - name: Günlük kayıtları yedekle
        if: always() && hashFiles('veri/gecmis.json') != '' && !(github.event_name == 'workflow_dispatch' && inputs.deneme)
        continue-on-error: true
        timeout-minutes: 1
        env:
          KAYIT_PAT: ${{ secrets.KAYIT_PAT }}
        run: python bot/yedek.py gonder

      # Yalnızca bu çalıştırma gün içi nokta yazdıysa (fiyat alan, deneme olmayan): başka işler eski dosyayı
      # yeniden yazıp bir kaydı silmesin.
      - name: Gün içi kayıtları sakla
        if: always() && hashFiles('veri/gun_ici_degisti.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: veri/gun_ici.json
          key: gunici-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Önizleme olarak sakla
        if: steps.uret.outputs.devam == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onizleme-${{ needs.kontrol.outputs.tur }}
          path: site
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: steps.uret.outputs.devam == 'true'
        with:
          path: site

  # Instagram geçici engel verirse ("API access blocked", istek sınırı, sunucu hatası) paylaşım adımı
  # 150 dakikaya kadar her 10 dakikada bir yeniden dener (bot/main.py → yayinla, --bekle-dk). Süre, bir
  # sonraki zamanlı paylaşıma yetişmeyecek şekilde seçildi (10:00 → 13:50 ve 13:50 → 19:50 arası > 150 dk);
  # concurrency grubu yüzünden bekleyen çalıştırma sıradakini de bekletir. Süre dolarsa iş hata verir,
  # engel kalkınca "Re-run failed jobs" aynı videoyu paylaşır (uret artifact'ı 7 gün durur).
  yayinla:
    needs: uret
    if: needs.uret.outputs.devam == 'true' && (github.event_name == 'schedule' || inputs.deneme == false)
    runs-on: ubuntu-24.04   # sabit sürüm: ubuntu-latest 19 Ekim 2026 itibarıyla Ubuntu 26e geçiyor
    timeout-minutes: 175
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # pazar yorumundan sonra bilgi sayfasını yeniden kurmak için (sayfa.yml)
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - name: Dosyayı internete koy (GitHub Pages)
        id: yayin
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q requests

      - uses: actions/download-artifact@v4
        with:
          name: onizleme-${{ needs.uret.outputs.tur }}
          path: site

      - name: Instagram'a paylaş
        timeout-minutes: 165
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          HIKAYE: ${{ needs.uret.outputs.hikaye }}             # yok: günlük sınır için hikâye kopyası gitmez
          GORUNEN_DOSYA: ${{ runner.temp }}/gorunen.txt        # paylaşılan içerik sayısı (günlük sınır)
        run: python bot/main.py yayinla --cikti site --url "${{ steps.yayin.outputs.page_url }}" --bekle-dk 150

      # Günlük sınır (bot/sinir.py): bu çalıştırmanın takipçiye gösterdiği gerçek içerik sayısı (akış + Reels +
      # hikâye) "gorunen-<deneme>-<sayı>" adlı küçük eser olarak saklanır; sonraki çalıştırmaların kontrol işi okur.
      - name: Görünen içerik sayısı
        id: gorunen
        if: always()
        run: echo "n=$(tr -dc '0-9' < "$RUNNER_TEMP/gorunen.txt" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Görünen içerik sayısını sakla
        if: always() && steps.gorunen.outputs.n != '' && steps.gorunen.outputs.n != '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gorunen-${{ github.run_attempt }}-${{ steps.gorunen.outputs.n }}
          path: ${{ runner.temp }}/gorunen.txt
          retention-days: 3

      # Pazar yorumu paylaşılınca bilgi sayfası yeniden kurulur: "Son pazar analizi" düğmesi aynı gün yeni yoruma
      # gitsin (Rıdvan, 18 Ekim 2026 "2 uygun"). Paylaşım bitmiş olduğu için Instagram dosyaları almıştır.
      # Hata verirse yalnızca uyarı; düğme bir sonraki paylaşımda (pazartesi ~10:00) güncellenir.
      - name: Bilgi sayfasını yenile (pazar yorumu)
        if: needs.uret.outputs.tur == 'yorum'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/sayfa.yml/dispatches" -f ref=main
