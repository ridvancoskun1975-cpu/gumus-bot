<svg id="goril-somurt" viewBox="0 0 320 350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="gs-isik" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#F07A6A" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#F07A6A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F07A6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gs-gumus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#A9B3BE"/>
    </linearGradient>
    <linearGradient id="gs-bulut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A919B"/>
      <stop offset="1" stop-color="#5E656F"/>
    </linearGradient>
    <path id="gs-damla" d="M0 -7 C2.5 -3 4 0 4 2.2 C4 4.6 2.2 6 0 6 C-2.2 6 -4 4.6 -4 2.2 C-4 0 -2.5 -3 0 -7 Z" fill="#9DBBDC"/>
  </defs>

  <g id="gs-hepsi">
    <ellipse id="gs-isik-el" cx="160" cy="220" rx="160" ry="140" fill="url(#gs-isik)"/>
    <ellipse cx="160" cy="341" rx="104" ry="9" fill="#000000" opacity="0.45"/>

    <!-- oturan goril -->
    <g id="gs-govde" class="goril-beden">
      <!-- dizler ve ayaklar (oturuyor) -->
      <g fill="#3B4149">
        <ellipse cx="110" cy="316" rx="40" ry="22"/>
        <ellipse cx="210" cy="316" rx="40" ry="22"/>
      </g>
      <g fill="#6F7680">
        <ellipse cx="86" cy="334" rx="24" ry="9" transform="rotate(-8 86 334)"/>
        <ellipse cx="234" cy="334" rx="24" ry="9" transform="rotate(8 234 334)"/>
      </g>
      <!-- gövde (aşağıda, çökmüş) -->
      <path d="M98 180 C66 188 58 240 70 280 C80 308 116 320 160 320 C204 320 240 308 250 280 C262 240 254 188 222 180 Z" fill="#454C55"/>
      <path d="M68 262 C66 282 72 296 86 306 C100 316 118 320 134 321 Q128 310 118 310 Q114 300 104 300 Q100 290 90 288 Q88 278 80 276 Q78 268 68 262 Z" fill="url(#gs-gumus)"/>
      <path d="M252 262 C254 282 248 296 234 306 C220 316 202 320 186 321 Q192 310 202 310 Q206 300 216 300 Q220 290 230 288 Q232 278 240 276 Q242 268 252 262 Z" fill="url(#gs-gumus)"/>
      <!-- göğüs (kolların üstünde kalan kısım) -->
      <path d="M118 204 C126 196 152 196 160 208 C168 196 194 196 202 204 C208 214 206 230 198 238 L122 238 C114 230 112 214 118 204 Z" fill="#7A818B"/>

      <!-- kavuşturulmuş kollar -->
      <g id="gs-kollar">
        <path d="M212 198 Q254 240 206 264 L126 266" stroke="#2B3037" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M212 198 Q254 240 206 264 L126 266" stroke="#454C55" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="120" cy="268" rx="17" ry="14" fill="#5E656F"/>
        <path d="M108 198 Q66 236 114 250 L194 248" stroke="#2B3037" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M108 198 Q66 236 114 250 L194 248" stroke="#4D545E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="200" cy="250" rx="17" ry="14" fill="#5E656F"/>
        <g stroke="#454C55" stroke-width="3" stroke-linecap="round">
          <path d="M204 241 l7 0"/><path d="M205 249 l8 0"/><path d="M204 257 l7 0"/>
        </g>
        <path d="M86 214 Q72 230 80 244" stroke="#C9D1DA" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
      </g>

      <!-- baş: somurtuyor -->
      <g id="gs-bas">
        <path d="M124 166 C118 142 128 120 148 112 C154 106 166 106 172 112 C192 120 202 142 196 166 C194 186 182 196 160 196 C138 196 126 186 124 166 Z" fill="#454C55"/>
        <path d="M132 152 C132 138 144 132 160 136 C176 132 188 138 188 152 C194 166 190 188 160 192 C130 188 126 166 132 152 Z" fill="#7A818B"/>
        <!-- çatık kaşlar -->
        <path d="M130 140 L156 150" stroke="#2B3037" stroke-width="7" stroke-linecap="round"/>
        <path d="M190 140 L164 150" stroke="#2B3037" stroke-width="7" stroke-linecap="round"/>
        <!-- yarı kapalı, aşağı bakan gözler -->
        <path d="M139 157 a6 5.5 0 0 0 12 0 Z" fill="#121418"/>
        <path d="M169 157 a6 5.5 0 0 0 12 0 Z" fill="#121418"/>
        <path d="M150 162 C150 156 170 156 170 162 C170 168 162 170 160 167 C158 170 150 168 150 162 Z" fill="#4C535C"/>
        <circle cx="155" cy="163" r="2.2" fill="#121418"/>
        <circle cx="165" cy="163" r="2.2" fill="#121418"/>
        <!-- aşağı kıvrık ağız, sarkık dudak -->
        <path d="M146 182 Q160 173 174 182" stroke="#121418" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M151 183 Q160 189 169 183" stroke="#5E656F" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- tepesindeki yağmur bulutu -->
    <g id="gs-bulut-grup">
      <g id="gs-yagmur">
        <use class="gs-d" href="#gs-damla" x="132" y="78" data-x="132" data-f="0.00"/>
        <use class="gs-d" href="#gs-damla" x="148" y="92" data-x="148" data-f="0.55"/>
        <use class="gs-d" href="#gs-damla" x="164" y="84" data-x="164" data-f="0.25"/>
        <use class="gs-d" href="#gs-damla" x="180" y="96" data-x="180" data-f="0.75"/>
        <use class="gs-d" href="#gs-damla" x="194" y="80" data-x="194" data-f="0.40"/>
        <use class="gs-d" href="#gs-damla" x="122" y="98" data-x="122" data-f="0.88"/>
      </g>
      <g id="gs-bulut">
        <ellipse cx="160" cy="58" rx="56" ry="15" fill="#5E656F"/>
        <circle cx="132" cy="50" r="18" fill="url(#gs-bulut)"/>
        <circle cx="160" cy="40" r="25" fill="url(#gs-bulut)"/>
        <circle cx="189" cy="49" r="19" fill="url(#gs-bulut)"/>
        <path d="M146 30 Q156 22 168 26" stroke="#A3ACB7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
