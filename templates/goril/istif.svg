<svg id="goril-istif" viewBox="0 0 320 350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="gi-isik" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#C9D1DA" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#C9D1DA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C9D1DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gi-gumus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#A9B3BE"/>
    </linearGradient>
    <linearGradient id="gi-kulce-on" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5DBE2"/>
      <stop offset="1" stop-color="#8E98A4"/>
    </linearGradient>
    <!-- tek külçe (yan görünüş): alt kenarın ortası (0,0) -->
    <g id="gi-kulce">
      <path d="M-33 0 L33 0 L28 -12 L-28 -12 Z" fill="url(#gi-kulce-on)"/>
      <path d="M-28 -12 L28 -12 L24 -16 L-24 -16 Z" fill="#F2F5F8"/>
      <path d="M-18 -7 L-8 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </defs>

  <g id="gi-hepsi">
    <ellipse cx="160" cy="210" rx="160" ry="145" fill="url(#gi-isik)"/>

    <!-- gölgeler -->
    <ellipse cx="122" cy="338" rx="82" ry="9" fill="#000000" opacity="0.45"/>
    <ellipse cx="266" cy="338" rx="44" ry="6" fill="#000000" opacity="0.45"/>

    <!-- külçe yığını (videoda büyür) -->
    <g id="gi-yigin" class="goril-beden">
      <use href="#gi-kulce" x="266" y="334"/>
      <use href="#gi-kulce" x="266" y="318"/>
      <use href="#gi-kulce" x="266" y="302"/>
      <use href="#gi-kulce" x="266" y="286"/>
      <use href="#gi-kulce" x="266" y="270"/>
      <use href="#gi-kulce" x="266" y="254"/>
      <use href="#gi-kulce" x="266" y="238"/>
    </g>

    <!-- goril (yığının solunda) -->
    <g class="goril-beden" transform="translate(-38 0) translate(160 338) scale(0.95) translate(-160 -338)">
      <g id="gi-govde">
        <g fill="#3B4149">
          <path d="M104 282 C96 304 98 324 110 332 L146 332 C150 318 148 300 142 286 Z"/>
          <path d="M216 282 C224 304 222 324 210 332 L174 332 C170 318 172 300 178 286 Z"/>
        </g>
        <g fill="#6F7680">
          <ellipse cx="124" cy="333" rx="26" ry="8"/>
          <ellipse cx="196" cy="333" rx="26" ry="8"/>
        </g>
        <path d="M98 160 C66 168 56 226 70 266 C80 296 116 310 160 310 C204 310 240 296 250 266 C264 226 254 168 222 160 Z" fill="#454C55"/>
        <path d="M70 212 C62 240 66 270 84 290 C98 304 120 310 140 311 Q132 297 120 298 Q116 284 104 286 Q102 272 92 272 Q92 258 84 255 Q86 242 78 238 Q80 225 70 212 Z" fill="url(#gi-gumus)"/>
        <path d="M250 212 C258 240 254 270 236 290 C222 304 200 310 180 311 Q188 297 200 298 Q204 284 216 286 Q218 272 228 272 Q228 258 236 255 Q234 242 242 238 Q240 225 250 212 Z" fill="url(#gi-gumus)"/>
        <path d="M116 186 C124 176 152 176 160 190 C168 176 196 176 204 186 C212 198 210 228 196 240 C184 250 168 246 160 236 C152 246 136 250 124 240 C110 228 108 198 116 186 Z" fill="#7A818B"/>
        <path d="M160 194 L160 232" stroke="#5E656F" stroke-width="3" stroke-linecap="round"/>
        <path d="M134 262 q26 12 52 0" stroke="#5E656F" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- sol kol: boyunca sarkar, parmak eklemleri yerde -->
        <path d="M110 178 Q66 232 80 304" stroke="#2B3037" stroke-width="47" stroke-linecap="round" fill="none"/>
        <path d="M110 178 Q66 232 80 304" stroke="#454C55" stroke-width="40" stroke-linecap="round" fill="none"/>
        <path d="M84 196 Q64 228 66 262" stroke="#C9D1DA" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
        <ellipse cx="82" cy="318" rx="21" ry="14" fill="#5E656F"/>
        <g stroke="#454C55" stroke-width="3" stroke-linecap="round">
          <path d="M72 322 l0 7"/><path d="M82 323 l0 7"/><path d="M92 322 l0 7"/>
        </g>

        <!-- baş -->
        <g id="gi-bas">
          <path d="M124 150 C118 126 128 104 148 96 C154 90 166 90 172 96 C192 104 202 126 196 150 C194 170 182 180 160 180 C138 180 126 170 124 150 Z" fill="#454C55"/>
          <path d="M132 136 C132 122 144 116 160 120 C176 116 188 122 188 136 C194 150 190 172 160 176 C130 172 126 150 132 136 Z" fill="#7A818B"/>
          <path d="M130 128 C138 118 152 118 160 126 C168 118 182 118 190 128 C184 126 176 127 170 132 L150 132 C144 127 136 126 130 128 Z" fill="#353B43"/>
          <!-- açık gözler: bakışı elindeki külçeyi izler -->
          <ellipse cx="145" cy="139" rx="6.5" ry="6" fill="#EDEFF2"/>
          <ellipse cx="175" cy="139" rx="6.5" ry="6" fill="#EDEFF2"/>
          <g id="gi-gozbebek" fill="#121418">
            <circle cx="145" cy="139" r="3.6"/>
            <circle cx="175" cy="139" r="3.6"/>
          </g>
          <path d="M150 146 C150 140 170 140 170 146 C170 152 162 154 160 151 C158 154 150 152 150 146 Z" fill="#4C535C"/>
          <circle cx="155" cy="147" r="2.2" fill="#121418"/>
          <circle cx="165" cy="147" r="2.2" fill="#121418"/>
          <!-- memnun, kapalı gülümseme -->
          <path d="M145 160 Q160 170 175 160" stroke="#121418" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <circle cx="137" cy="155" r="4" fill="#F07A6A" opacity="0.25"/>
          <circle cx="183" cy="155" r="4" fill="#F07A6A" opacity="0.25"/>
        </g>
      </g>
    </g>

    <!-- sağ kol ve taşınan külçe (konumu betikte hesaplanır) -->
    <g id="gi-kol" class="goril-beden">
      <path id="gi-kol-kontur" d="M162 178 Q214 196 226 238" stroke="#2B3037" stroke-width="47" stroke-linecap="round" fill="none"/>
      <path id="gi-kol-ic" d="M162 178 Q214 196 226 238" stroke="#454C55" stroke-width="40" stroke-linecap="round" fill="none"/>
      <g id="gi-tasinan" transform="translate(226 262)"><use href="#gi-kulce" x="0" y="0"/></g>
      <g id="gi-el" transform="translate(226 240)">
        <ellipse cx="0" cy="0" rx="20" ry="15" fill="#5E656F"/>
        <g stroke="#454C55" stroke-width="3" stroke-linecap="round">
          <path d="M-9 2 l0 9"/><path d="M0 3 l0 9"/><path d="M9 2 l0 9"/>
        </g>
      </g>
    </g>

    <!-- "tın" parıltısı -->
    <path id="gi-tin" d="M0 -12 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="#FFFFFF" opacity="0"/>
  </g>
</svg>
