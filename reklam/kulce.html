<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gümüş külçeler · 3D</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  @font-face { font-family: 'Archivo'; font-weight: 100 900; src: url('assets/archivo-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Archivo'; font-weight: 100 900; src: url('assets/archivo-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  /* Ekran yazısı: 1. cümle sahnenin altında, Reels güvenli alanında (alt 420 px, sağ 170 px) */
  #yazi { position: absolute; left: 96px; right: 170px; top: 1360px; color: #EDEFF2; font-family: 'Archivo', sans-serif;
    font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -3px; opacity: 0; }
  #yazi em { font-style: normal; color: #C9D1DA; }
  #alt { position: absolute; left: 98px; top: 1610px; color: #9AA3AE; font-family: 'Archivo', sans-serif; font-weight: 500;
    font-size: 28px; letter-spacing: 1px; opacity: 0; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('assets/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
</style>
</head>
<body>
<div id="yazi">Gümüş bugün<br><em>kaç lira?</em></div>
<div id="alt">gunlukgumus.com</div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);
// Stüdyo çevresi: siyah odada birkaç uzun ışık paneli (gümüşte keskin, kontrastlı yansımalar için)
function studyo() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x000000);
  // Yumuşak kubbe: üst açık gri, alt siyah (geniş, yumuşak yansıma; külçe kapkara kalmasın)
  const kubbe = new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
    vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 p; void main(){ float u = clamp(p.y/30.0, -1.0, 1.0); float g = u < 0.0 ? mix(0.0, 0.34, smoothstep(-0.55, -0.04, u)) : mix(0.34, 0.42, smoothstep(0.0, 0.95, u)); gl_FragColor = vec4(vec3(g), 1.0); }' }));
  s.add(kubbe);
  const panel = (w, h, x, y, z, rx, ry, rz, c, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz); s.add(m);
  };
  panel(18, 3.2, 0, 7, -4, Math.PI / 2.6, 0, 0, 0xffffff, 9);      // tepe uzun panel (arka)
  panel(18, 2.2, 0, 7.5, 4, -Math.PI / 2.6, 0, 0, 0xf4f7ff, 3.5);    // tepe uzun panel (ön)
  panel(5, 10, -9, 3, 0, 0, Math.PI / 2, 0, 0xdde7ff, 5);          // sol dikey soğuk panel
  panel(5, 10, 9, 3, 0, 0, -Math.PI / 2, 0, 0xfff3e4, 3);          // sağ dikey sıcak panel
  panel(10, 2, 0, 2.5, -9, 0, 0, 0, 0xffffff, 1.2);                 // arka alçak panel
  panel(16, 5, 0, -1.2, 9, Math.PI / 2.4, 0, 0, 0xffffff, 2.4);      // ön alçak sektirme kartı (yukarıdan bakınca yüzler kararmasın)
  panel(18, 0.7, 0, 5.2, 1.5, -Math.PI / 2.2, 0, 0, 0xffffff, 9);    // ince keskin tepe çizgisi
  panel(2.2, 10, -7.5, 3, 5, 0, Math.PI / 3, 0, 0xffffff, 4);        // sol ön dikey şerit
  panel(2.2, 10, 7.5, 3, 5, 0, -Math.PI / 3, 0, 0xffffff, 4);        // sağ ön dikey şerit
    return s;
}
const env = pmrem.fromScene(studyo(), 0.02).texture;
scene.environment = env;
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);

// Külçe: döküm biçimi (kalıptan çıkmış: üst geniş, alt dar), yuvarlatılmış kenar. Üstünde çerçeve ve damga yazısı
// (canvas'ta kendimiz çizeriz; kabartma haritası olarak uygulanır, harfler bozulmaz).
function kulce(w = 1.0, h = 0.5, d = 2.0) {
  const g = new RoundedBoxGeometry(w, h, d, 6, 0.03);
  const pos = g.attributes.position;
  const k = 0.11;                                   // alt kenar %11 dar (profil resmindeki döküm biçimi)
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), s = 1 - k * (0.5 - y / h);
    pos.setX(i, pos.getX(i) * s); pos.setZ(i, pos.getZ(i) * s);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
// Damga: profil resmindeki gibi "SILVER / 999.9 FINE" ve çerçeve, oyma (koyu = çukur). Harfleri biz çizeriz.
function damga() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0, 0, 1024, 512);
  x.translate(512, 256); x.rotate(Math.PI); x.translate(-512, -256);   // bu açıdan düz okunsun
  x.strokeStyle = '#303030'; x.lineWidth = 7; x.strokeRect(40, 46, 944, 420);
  x.fillStyle = '#202020'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '900 190px Archivo, sans-serif';
  x.save(); x.translate(512, 200); x.scale(1.0, 1.0); x.fillText('SILVER', 0, 0); x.restore();
  x.font = '700 84px "JetBrains Mono", monospace'; x.fillText('999.9   FINE', 512, 372);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8;
  return t;
}
function puruz() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#121212'; x.fillRect(0, 0, 1024, 512);          // ayna yüzey (pürüz ~0,07)
  x.translate(512, 256); x.rotate(Math.PI); x.translate(-512, -256);
  x.strokeStyle = '#8a8a8a'; x.lineWidth = 7; x.strokeRect(40, 46, 944, 420);
  x.fillStyle = '#9a9a9a'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '900 190px Archivo, sans-serif'; x.fillText('SILVER', 512, 200);
  x.font = '700 84px "JetBrains Mono", monospace'; x.fillText('999.9   FINE', 512, 372);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8;
  return t;
}
const metal = new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f6, metalness: 1.0, roughness: 0.07, clearcoat: 0.5, clearcoatRoughness: 0.05,
  envMapIntensity: 1.5, reflectivity: 1.0,
});
const ustMetal = metal.clone();
ustMetal.bumpMap = damga(); ustMetal.bumpScale = 1.6; ustMetal.roughnessMap = puruz(); ustMetal.roughness = 1.0;
const geo = kulce();
const grup = new THREE.Group();
scene.add(grup);
const H1 = 0.5, GX = 1.04;
// Profil resmindeki dizilim: uzun kenar derinlikte; altta 3 yan yana, üstte 2, en üstte 1
const yerler = [
  [-GX, 0, 0, 0.012], [0, 0, 0, -0.006], [GX, 0, 0, 0.009],
  [-GX / 2, H1, 0, -0.005], [GX / 2, H1, 0, 0.007],
  [0, 2 * H1, 0, 0.0],
];
for (const [x, y, z, r] of yerler) {
  const m = new THREE.Mesh(geo, metal);
  m.position.set(x, y + H1 / 2, z);
  m.rotation.y = r;
  m.castShadow = true; m.receiveShadow = true;
  const ust = new THREE.Mesh(new THREE.PlaneGeometry(2.0 - 0.08, 1.0 - 0.08), ustMetal);
  ust.rotation.x = -Math.PI / 2; ust.rotation.z = Math.PI / 2;    // yazı uzun kenar boyunca, önden okunur
  ust.position.y = H1 / 2 + 0.0015;
  m.add(ust);
  grup.add(m);
}
// Zemin: koyu, hafif parlak; külçelerin yansıması için aynalanmış kopya ve üstünde karartma
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x07080a, metalness: 0.6, roughness: 0.45 }));
zemin.rotation.x = -Math.PI / 2; zemin.receiveShadow = true;
scene.add(zemin);
zemin.material = new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.55 });   // yalnız gölge; zemin siyah
// Yansıma: külçelerin aynalanmış soluk kopyası, zeminden uzaklaştıkça siyaha karışır
const yansima = grup.clone();
yansima.scale.y = -1;
yansima.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshPhysicalMaterial({ color: 0xeef1f4, metalness: 1, roughness: 0.2, envMapIntensity: 0.8, transparent: true, opacity: 0.5, depthWrite: false }); o.castShadow = false; o.receiveShadow = false; } });
scene.add(yansima);
const solgun = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: 'varying vec3 p; void main(){ p = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: 'varying vec3 p; void main(){ float d = max(abs(p.x)-1.6, 0.0); float z = abs(p.z); float a = smoothstep(0.3, 3.0, z) ; a = max(a, smoothstep(0.2, 2.0, d)); gl_FragColor = vec4(0.0,0.0,0.0,a); }',
}));
solgun.rotation.x = -Math.PI / 2; solgun.position.y = 0.0015; solgun.renderOrder = 2;
scene.add(solgun);
const havuz = new THREE.SpotLight(0xffffff, 10, 20, 0.5, 0.9, 1.2); havuz.position.set(0, 7, 0); havuz.target.position.set(0, 0, 0); scene.add(havuz, havuz.target);

// Işıklar: anahtar ışık (gölge), tepe ışığı, soğuk kenar ışığı, gezen parıltı ışığı
const anahtar = new THREE.SpotLight(0xffffff, 60, 30, 0.55, 0.5, 1.6);
anahtar.position.set(4, 7, 5); anahtar.castShadow = true;
anahtar.shadow.mapSize.set(2048, 2048); anahtar.shadow.bias = -0.0004; anahtar.shadow.radius = 4;
scene.add(anahtar);
const kenar = new THREE.DirectionalLight(0xbfd3ff, 1.6); kenar.position.set(-6, 3, -4); scene.add(kenar);
const tepe = new THREE.PointLight(0xffffff, 18, 20, 1.5); tepe.position.set(0, 5, 1); scene.add(tepe);
const parilti = new THREE.PointLight(0xffffff, 0, 12, 2.0); scene.add(parilti);

// Sahne süresi ve kamera: alçak açıyla yakından başlar, 5 sn'de ~80° dolaşıp hafif yükselir ve açılır
const SURE = 5.0;
const kenet = x => Math.min(Math.max(x, 0), 1);
const yum = x => { x = kenet(x); return x * x * (3 - 2 * x); };
const yazi = document.getElementById('yazi'), alt = document.getElementById('alt');

window.kare = function (t) {
  const u = kenet(t / SURE);
  const aci = -1.3 + 0.75 * u;                   // soldan, külçeler çapraz dursun (profil resmi gibi)                   // radyan: soldan sağa dolaş
  const yar = 10.4 - 1.4 * yum(u);                // yaklaş
  const yuk = 2.0 + 1.4 * yum(u);                 // yüksel
  camera.position.set(Math.sin(aci) * yar, yuk, Math.cos(aci) * yar);
  camera.lookAt(0, 0.7, 0);
  // çevre yansımaları yavaşça kayar (metal canlı görünsün)
  scene.environmentRotation.y = -0.9 * (t / SURE);   // kamerayla birlikte, yansımalar hep önde kalsın
  // gezen parıltı: 1,0–2,6 sn arasında üstten geçer
  const p = (t - 1.0) / 1.6;
  if (p > 0 && p < 1) { parilti.intensity = 45 * Math.sin(Math.PI * p); parilti.position.set(-3 + 6 * p, 2.6, 1.2 - 0.6 * p); }
  else parilti.intensity = 0;
  // yazı 1,2 sn'de belirir, 4,6 sn'de kaybolur
  const g = yum((t - 0.9) / 0.5) * (1 - yum((t - 4.5) / 0.4));
  yazi.style.opacity = g.toFixed(3);
  yazi.style.transform = `translateY(${((1 - yum((t - 0.9) / 0.5)) * 30).toFixed(1)}px)`;
  alt.style.opacity = (yum((t - 2.0) / 0.6) * (1 - yum((t - 4.5) / 0.4))).toFixed(3);
  renderer.render(scene, camera);
};
window.hazir = true;
window.kare(2.4);
</script>
</body>
</html>
