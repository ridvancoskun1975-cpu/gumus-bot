<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahne 2 · program</title>
<style>
@font-face { font-family: 'Archivo'; font-weight: 100 900; src: url('assets/archivo-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Archivo'; font-weight: 100 900; src: url('assets/archivo-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('assets/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('assets/jetbrains-mono-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root { --zemin: #000; --yazi: #EDEFF2; --soluk: #9AA3AE; --cizgi: #2C313A; --vurgu: #C9D1DA; }
html, body { margin: 0; background: var(--zemin); overflow: hidden; }
.sahne { position: relative; width: 1920px; height: 1080px; background: var(--zemin); color: var(--yazi); font-family: 'Archivo', sans-serif; overflow: hidden; }
.mono { font-family: 'JetBrains Mono', monospace; }
.isik { position: absolute; inset: -20% 0; pointer-events: none; transform: translateX(-140%);
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.08) 50%, transparent 65%); }
.vinyet { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(201,209,218,0.07), transparent 60%); }
.ust { position: absolute; left: 110px; right: 110px; top: 80px; display: flex; justify-content: space-between; align-items: flex-start; }
.etiket { display: flex; align-items: center; gap: 14px; font-weight: 500; letter-spacing: 4px; color: var(--soluk); font-size: 30px; }
.nokta { width: 14px; height: 14px; border-radius: 50%; background: var(--vurgu); display: inline-block; }
.ag { box-sizing: border-box; width: 118px; height: 134px; padding: 10px 12px; border: 3px solid var(--vurgu); border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
.ag b { font-weight: 800; line-height: 1; color: var(--vurgu); font-size: 48px; }
.ag span { color: var(--soluk); font-size: 20px; }
.liste { position: absolute; left: 110px; right: 110px; top: 250px; }
.satir { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; padding: 26px 0 24px; border-bottom: 2px solid var(--cizgi); opacity: 0; }
.satir .zaman { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 66px; color: var(--vurgu); line-height: 1; padding-top: 6px; white-space: nowrap; }
.satir .zaman small { display: block; font-size: 26px; color: var(--soluk); font-weight: 500; margin-top: 12px; letter-spacing: 1px; }
.satir b { display: block; font-size: 64px; font-weight: 800; line-height: 1.02; letter-spacing: -2px; }
.satir span { display: inline; font-size: 34px; margin-left: 28px; color: var(--soluk); font-weight: 500; line-height: 1.2; }
.satir.pazar b { color: #fff; }
.alt { position: absolute; left: 110px; right: 110px; top: 960px; display: flex; justify-content: space-between; align-items: baseline; opacity: 0; }
.alt b { font-size: 34px; }
.alt span { font-size: 24px; color: var(--soluk); }
</style>
</head>
<body>
<div class="sahne">
  <div class="vinyet"></div>
  <div class="isik"></div>
  <div class="ust" id="ust" style="opacity:0">
    <div class="etiket"><span class="nokta"></span><span>GÜMÜŞ FİYATLARI</span></div>
    <div class="ag"><span class="mono">47</span><b>Ag</b><span class="mono">107,87</span></div>
  </div>
  <div class="liste">
    <div class="satir" id="s0"><div class="zaman">~10:00<small>hafta içi</small></div><div><b>Güncel fiyat <span>Gram gümüş, gün içinde güncellenir</span></b></div></div>
    <div class="satir" id="s1"><div class="zaman">~20:00<small>hafta içi</small></div><div><b>Günün özeti <span>Gün içi en düşük ve en yüksek</span></b></div></div>
    <div class="satir pazar" id="s2"><div class="zaman">Pazar<small>her hafta</small></div><div><b>Üst düzey yapay zekâ analizi <span>Kısa ve orta vade</span></b></div></div>
  </div>
  <div class="alt" id="alt"><b>@gunlukgumus</b><span>Bilgi amaçlıdır, yatırım tavsiyesi değildir.</span></div>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const kenet = x => Math.min(Math.max(x, 0), 1);
  const yum = x => { x = kenet(x); return x * x * (3 - 2 * x); };
  const ara = (t, a, b) => yum((t - a) / (b - a));
  const isik = document.querySelector('.isik');
  function gir(el, g, dx, dy) { el.style.opacity = g.toFixed(3); el.style.transform = `translate(${((1 - g) * (dx || 0)).toFixed(1)}px, ${((1 - g) * (dy || 0)).toFixed(1)}px)`; }
  const SURE = 6.0;
  window.kare = function (t) {
    const son = 1 - ara(t, SURE - 0.35, SURE);          // sonda hep birlikte söner
    gir($('ust'), ara(t, 0.0, 0.45) * son, 0, -20);
    gir($('s0'), ara(t, 0.25, 0.75) * son, -70, 0);
    gir($('s1'), ara(t, 1.55, 2.05) * son, -70, 0);
    gir($('s2'), ara(t, 3.0, 3.5) * son, -70, 0);
    gir($('alt'), ara(t, 4.0, 4.5) * son, 0, 20);
    const p = t >= 3.4 && t < 4.7 ? (t - 3.4) / 1.3 : null;
    isik.style.transform = p === null ? 'translateX(-140%)' : `translateX(${(-140 + 280 * p).toFixed(1)}%)`;
  };
  window.hazir = true;
  window.kare(5.0);
})();
</script>
</body>
</html>
